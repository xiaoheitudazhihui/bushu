<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网页</title>
    <style>
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 30px;
        }
        .box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
            max-width: 600px;
        }
        h1 {
            color: #222;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        button {
            padding: 8px 18px;
            border: none;
            background: #409eff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello HTML</h1>
        <p>这是一个带CSS样式的基础HTML页面，支持手机自适应。</p>
        <button onclick="alert('你点击了按钮！')">点我试试</button>
    </div>
</body>
</html>
